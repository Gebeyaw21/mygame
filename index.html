    <script>
        const socket = io('https://bingo-server-9kkr.onrender.com');
        
        // ድምፅ ማጫወቻዎች
        const callSound = new Audio('https://actions.google.com/sounds/v1/ui/click.ogg');
        const winSound = new Audio('https://actions.google.com/sounds/v1/ui/happy_chime_positive.ogg');

        socket.on('numberCalled', (data) => {
            callSound.play(); // እዚህ ጋር ድምፅ ይኖረዋል
            let nextNum = data.number;
            let letter = (nextNum <= 15) ? 'B' : (nextNum <= 30) ? 'I' : (nextNum <= 45) ? 'N' : (nextNum <= 60) ? 'G' : 'O';
            document.getElementById('current-call').innerText = `${letter}-${nextNum}`;
        });

        function checkBingo() {
            winSound.play(); // እዚህ ጋር አሸናፊ ድምፅ ይኖረዋል
            alert("ቢንጎ ማረጋገጫ ተላከ!");
        }

        // ... የተቀረው የካርቴላ መፍጠሪያ ኮድህ እንዳለ ይቆያል
        // generateCartela() እና requestStart() ተግባራት እንዳሉ ይቆዩ
    </script>
