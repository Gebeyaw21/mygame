<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afro Style Bingo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .active-num { background-color: #f59e0b !important; color: white; font-weight: bold; }
        .marked { background-color: #10b981 !important; color: white; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen font-sans">

    <!-- Header Section -->
    <header class="bg-slate-800 p-4 border-b border-slate-700 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold text-amber-500">ስማርት ቢንጎ</h1>
            <p class="text-xs text-gray-400">Game ID: #BG<span id="game-id">889</span></p>
        </div>
        <div class="bg-slate-700 px-3 py-1 rounded-lg text-right">
            <span class="text-xs text-gray-300 block">ድራሽ (Prize Pool)</span>
            <span class="text-lg font-bold text-green-400" id="prize-pool">100 ETB</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="p-4 max-w-md mx-auto space-y-4">
        
        <!-- Current Call Display -->
        <div class="bg-purple-900 border-2 border-purple-500 rounded-xl p-4 text-center shadow-lg">
            <span class="text-xs text-purple-300 uppercase tracking-wider block mb-1">አሁን የተጠራው ቁጥር</span>
            <div id="current-call" class="text-5xl font-black text-amber-400 my-1">--</div>
        </div>

        <!-- Bingo Cartela (5x5 Grid) -->
        <div class="bg-slate-800 p-3 rounded-xl border border-slate-700 shadow-md">
            <div class="flex justify-between items-center mb-2">
                <span class="text-sm font-semibold text-amber-400">ካርቴላ (Cartela #1)</span>
                <button onclick="generateCartela()" class="text-xs bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded">ቀይር</button>
            </div>
            
            <div class="grid grid-cols-5 gap-1 text-center font-bold text-sm mb-1">
                <div class="bg-amber-500 text-slate-900 py-1 rounded">B</div>
                <div class="bg-amber-500 text-slate-900 py-1 rounded">I</div>
                <div class="bg-amber-500 text-slate-900 py-1 rounded">N</div>
                <div class="bg-amber-500 text-slate-900 py-1 rounded">G</div>
                <div class="bg-amber-500 text-slate-900 py-1 rounded">O</div>
            </div>

            <div id="cartela-grid" class="grid grid-cols-5 gap-1 text-center text-sm">
                <!-- Numbers generated dynamically -->
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex gap-2">
            <button onclick="startGame()" class="w-1/2 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-xl shadow-lg transition">
                ጨዋታ ጀምር
            </button>
            <button onclick="checkBingo()" class="w-1/2 bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl shadow-lg transition">
                BINGO!
            </button>
        </div>

    </main>

    <script>
        let cartelaNumbers = [];
        let calledNumbers = [];
        let intervalId = null;

        // Generate Random Cartela
        function generateCartela() {
            const grid = document.getElementById('cartela-grid');
            grid.innerHTML = '';
            cartelaNumbers = [];

            const ranges = [
                [1, 15], [16, 30], [31, 45], [46, 60], [61, 75]
            ];

            let columns = [];
            for (let i = 0; i < 5; i++) {
                let col = [];
                while (col.length < 5) {
                    let num = Math.floor(Math.random() * (ranges[i][1] - ranges[i][0] + 1)) + ranges[i][0];
                    if (!col.includes(num)) col.push(num);
                }
                columns.push(col);
            }

            for (let row = 0; row < 5; row++) {
                for (let col = 0; col < 5; col++) {
                    const btn = document.createElement('div');
                    btn.className = 'bg-slate-700 p-3 rounded font-bold cursor-pointer transition';
                    
                    if (row === 2 && col === 2) {
                        btn.innerText = '★';
                        btn.classList.add('marked');
                        cartelaNumbers.push('FREE');
                    } else {
                        let num = columns[col][row];
                        btn.innerText = num;
                        btn.id = `cell-${num}`;
                        btn.onclick = () => btn.classList.toggle('marked');
                        cartelaNumbers.push(num);
                    }
                    grid.appendChild(btn);
                }
            }
        }

        // Start Calling Numbers
        function startGame() {
            if (intervalId) clearInterval(intervalId);
            calledNumbers = [];
            document.getElementById('current-call').innerText = '--';

            intervalId = setInterval(() => {
                if (calledNumbers.length >= 75) {
                    clearInterval(intervalId);
                    alert("ሁሉም ቁጥሮች ተጠርተው አልቀዋል!");
                    return;
                }

                let nextNum;
                do {
                    nextNum = Math.floor(Math.random() * 75) + 1;
                } while (calledNumbers.includes(nextNum));

                calledNumbers.push(nextNum);
                
                let letter = '';
                if (nextNum <= 15) letter = 'B';
                else if (nextNum <= 30) letter = 'I';
                else if (nextNum <= 45) letter = 'N';
                else if (nextNum <= 60) letter = 'G';
                else letter = 'O';

                document.getElementById('current-call').innerText = `${letter}-${nextNum}`;
            }, 3000);
        }

        function checkBingo() {
            alert("ቢንጎ ማረጋገጫ በደረጃ 2 ሰርቨር ላይ ይገናኛል!");
        }

        // Initialize on load
        generateCartela();
    </script>
</body>
</html>
